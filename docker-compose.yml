# Local development environment (Phase 3).
#
#   cp .env.example .env            # then edit the values
#   docker compose --profile infra up -d --wait
#   docker compose --profile infra --profile observability up -d --wait   # with telemetry
#
# Profiles:
#   infra          PostgreSQL + pgvector, Redis, Keycloak, S3 (S3Mock), SQS (ElasticMQ)
#   observability  OpenTelemetry Collector, Tempo (traces), Prometheus (metrics), Grafana
#   apps   core-api and ai-service (added when their images are built; Phase 3 runs them from the IDE)
#
# Images are pinned to explicit versions; upgrades go through pull requests.
name: hip

services:
  postgres:
    profiles: [infra]
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hip
      CORE_OWNER_PASSWORD: ${CORE_OWNER_PASSWORD:?set CORE_OWNER_PASSWORD in .env}
      CORE_APP_PASSWORD: ${CORE_APP_PASSWORD:?set CORE_APP_PASSWORD in .env}
      AI_OWNER_PASSWORD: ${AI_OWNER_PASSWORD:?set AI_OWNER_PASSWORD in .env}
      AI_APP_PASSWORD: ${AI_APP_PASSWORD:?set AI_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hip && psql -U postgres -d hip -tAc \"select 1 from pg_namespace where nspname = 'ai'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    profiles: [infra]
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    profiles: [infra]
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:8180
      KC_CORE_API_SERVICE_SECRET: ${KC_CORE_API_SERVICE_SECRET:?set KC_CORE_API_SERVICE_SECRET in .env}
      KC_SYNTHETIC_USER_PASSWORD: ${KC_SYNTHETIC_USER_PASSWORD:?set KC_SYNTHETIC_USER_PASSWORD in .env}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./infra/docker/keycloak/hip-realm.json:/opt/keycloak/data/import/hip-realm.json:ro
    healthcheck:
      # The image has no curl; use bash's /dev/tcp against the management port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": *"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  s3:
    profiles: [infra]
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: hip-documents-local
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "false"
    ports:
      - "127.0.0.1:9090:9090"

  sqs:
    profiles: [infra]
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "127.0.0.1:9324:9324"
      - "127.0.0.1:9325:9325"
    volumes:
      - ./infra/docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro

  # --- observability profile (E2-T6) ------------------------------------------------------------
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:13133:13133" # health check
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --enable-feature=exemplar-storage
    ports:
      - "127.0.0.1:9091:9090" # 9090 is taken by S3Mock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.4.13
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  tempo-data:
