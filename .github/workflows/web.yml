name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "contracts/core-api.openapi.yaml", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "contracts/core-api.openapi.yaml", ".github/workflows/web.yml"]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Generated API types match the OpenAPI contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Production audit
        run: npm audit --omit=dev --audit-level=high
