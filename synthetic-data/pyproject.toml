[project]
name = "synthetic-data"
version = "0.1.0"
description = "Deterministic synthetic laboratory reports (PDF) with ground truth for extraction evaluation. Synthetic data only."
requires-python = ">=3.12"
dependencies = [
    "reportlab>=4.2",
    "pillow>=11.0",
    "pypdf>=5.1",
    "jsonschema[format-nongpl]>=4.23",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
