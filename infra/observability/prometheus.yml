# Prometheus (local). In Phase 3 the services run on the host (IDE or `mvn`/`uv` commands),
# so they are reached through host.docker.internal.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: core-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { service: core-api }

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels: { service: ai-service }

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
