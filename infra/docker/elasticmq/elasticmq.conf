# Local SQS emulator (ElasticMQ). Queue names match ADR 0003.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  document-extraction-requests {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "document-extraction-requests-dlq"
      maxReceiveCount = 5
    }
  }
  document-extraction-requests-dlq {}

  document-extraction-results {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "document-extraction-results-dlq"
      maxReceiveCount = 5
    }
  }
  document-extraction-results-dlq {}

  ai-indexing-requests {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "ai-indexing-requests-dlq"
      maxReceiveCount = 5
    }
  }
  ai-indexing-requests-dlq {}
}
