# OpenTelemetry Collector (local). Receives OTLP from core-api and ai-service, scrubs attributes that
# could carry personal data, and forwards traces to Tempo. Metrics are scraped by Prometheus directly.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  # Defence in depth (threat model T10): instrumentation must not record these, but drop them
  # here too in case a library or a future change does.
  attributes/scrub:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: url.query, action: delete }
      - { key: http.url, action: delete }
      - { key: db.statement, action: delete }
      - { key: db.query.text, action: delete }
      - { key: enduser.id, action: delete }
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true # local network only
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlp/tempo]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0 # scraped by the Prometheus container
                port: 8888
