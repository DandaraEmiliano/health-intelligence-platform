spring:
  application:
    name: core-api
  threads:
    virtual:
      enabled: true
  datasource:
    # Runtime connects as the least-privileged role (ADR 0005).
    url: ${CORE_DB_URL:jdbc:postgresql://localhost:5432/hip}
    username: ${CORE_DB_APP_USER:core_app}
    password: ${CORE_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${CORE_DB_POOL_SIZE:10}
  flyway:
    # Migrations run as the schema owner; the app role only gets DML through default privileges.
    url: ${CORE_DB_URL:jdbc:postgresql://localhost:5432/hip}
    user: ${CORE_DB_OWNER_USER:core_owner}
    password: ${CORE_OWNER_PASSWORD:}
    schemas: core
    default-schema: core
    create-schemas: false
    locations: classpath:db/migration
    placeholders:
      appRole: ${CORE_DB_APP_USER:core_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: core
      hibernate.jdbc.time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # The 10 MB document limit is enforced in code with a clear error; these leave headroom.
      max-file-size: 11MB
      max-request-size: 12MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jackson:
    deserialization:
      # Request schemas are closed (additionalProperties: false in the contract).
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/hip}
          audiences: core-api

hip:
  accounts:
    purge:
      # Longer than the access token lifetime (5 minutes), see AccountPurgeJob. The retention
      # period itself is a legal decision (docs/security/privacy-requirements-map.md).
      after: ${ACCOUNT_PURGE_AFTER:10m}
      interval: 1m
      batch-size: 10
  identity:
    admin:
      enabled: ${KEYCLOAK_ADMIN_ENABLED:true}
      base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
      realm: hip
      client-id: core-api-admin
      client-secret: ${KC_CORE_API_ADMIN_SECRET:}
  aws:
    region: ${AWS_REGION:sa-east-1}
    # Local emulators (ADR 0012). Leave empty in AWS to use the real endpoints.
    s3-endpoint: ${AWS_ENDPOINT_URL_S3:http://localhost:9090}
    sqs-endpoint: ${AWS_ENDPOINT_URL_SQS:http://localhost:9324}
  documents:
    bucket: ${DOCUMENTS_BUCKET:hip-documents-local}
    max-size-bytes: 10485760
    # Pre-signed download links (threat model T09).
    download-url-ttl: 60s
  extraction:
    extractor-version: ${EXTRACTOR_VERSION:1.0.0}
    queue: document-extraction-requests
    results:
      queue: document-extraction-results
      poll-interval: 1s
      listener:
        enabled: ${EXTRACTION_RESULTS_LISTENER_ENABLED:true}
  idempotency:
    ttl: 24h
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      fixed-delay: 1s
      batch-size: 25
      max-attempts: 20
  cors:
    # Comma-separated browser origins allowed to call the API (ADR 0013).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readiness-state:
      enabled: true
  info:
    env:
      enabled: false
  metrics:
    tags:
      service: core-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      service.name: core-api
    # Trace export is enabled by setting MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT,
    # e.g. http://localhost:4318/v1/traces (observability profile). Unset: spans are not exported.

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

logging:
  structured:
    format:
      console: ecs
