# Render Blueprint for the free demo (docs/deploy/render.md, ADR 0015). Synthetic data only.
#
#   hip-app    core-api + the web app, built-in sign-in (render/app.Dockerfile)
#   hip-ai     ai-service, extraction and assistant (ai-service/Dockerfile)
#   hip-redis  sessions, rate limits and idempotency keys (Render Key Value)
#   PostgreSQL is on Neon (free, does not expire); prepare it with scripts/render/bootstrap-neon.sh.
#
# Values marked sync: false are asked for when the Blueprint is created; the guide lists each one.
envVarGroups:
  - name: hip-shared
    envVars:
      # Shared secret between hip-app and hip-ai (at least 32 characters; Render generates 256 bits).
      - key: HIP_INTERNAL_TOKEN
        generateValue: true

services:
  - type: web
    name: hip-app
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./render/app.Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: commit
    envVars:
      - fromGroup: hip-shared
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: PORT
        value: "8080"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hip-redis
          property: connectionString
      - key: DOCUMENTS_LINK_SECRET
        generateValue: true
      # jdbc:postgresql://<neon host>/neondb?sslmode=require
      - key: CORE_DB_URL
        sync: false
      - key: CORE_OWNER_PASSWORD
        sync: false
      - key: CORE_APP_PASSWORD
        sync: false
      # The public URL of hip-ai, e.g. https://hip-ai.onrender.com (shown after the first deploy).
      - key: AI_SERVICE_URL
        sync: false

  - type: web
    name: hip-ai
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - fromGroup: hip-shared
      - key: PORT
        value: "8081"
      - key: AI_MESSAGING_TRANSPORT
        value: http
      - key: AI_DB_SSLMODE
        value: require
      - key: AI_DB_NAME
        value: neondb
      # The Neon host, e.g. ep-xxxx.sa-east-1.aws.neon.tech
      - key: AI_DB_HOST
        sync: false
      - key: AI_OWNER_PASSWORD
        sync: false
      - key: AI_APP_PASSWORD
        sync: false
      # The public URL of hip-app, e.g. https://hip-app.onrender.com
      - key: AI_CORE_API_URL
        sync: false
      # Optional. Empty: uploads stay "em processamento" and the assistant answers that it is
      # unavailable. Set it only with a spending limit on the Anthropic account.
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: keyvalue
    name: hip-redis
    plan: free
    region: virginia
    # Internal connections only.
    ipAllowList: []
    maxmemoryPolicy: noeviction
