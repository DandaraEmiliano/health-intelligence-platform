name: bff

on:
  push:
    branches: [main]
    paths: ["bff/**", ".github/workflows/bff.yml"]
  pull_request:
    paths: ["bff/**", ".github/workflows/bff.yml"]

permissions:
  contents: read

concurrency:
  group: bff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Session handling, CSRF, token relay and cookie attributes against a real Redis (Testcontainers).
      - name: mvn verify
        run: mvn -B -ntp verify
